name: Deploy To EC2
on:
    push:
      branches:
        - main

jobs:
    deploy:
      runs-on: ubuntu-latest
    
      steps:
       - name: checkout code
         uses: actions/checkout@v6
       - name: deploy via ssh
         uses: appleboy/ssh-action@v1
         with:
          host: ${{secrets.SSH_HOST}}
          username: ubuntu
          key: ${{secrets.SSH_KEY}}
          script: |
            cd ~/learn-deployment-
            git pull
            sudo docker compose down
            sudo docker up -d --build

